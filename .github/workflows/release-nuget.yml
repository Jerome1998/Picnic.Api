name: Release NuGet

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: write

jobs:
  pack-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve version from release tag
        id: version
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Using package version: $VERSION"

      - name: Restore
        run: dotnet restore Picnic.Api/Picnic.Api.csproj

      - name: Build
        run: dotnet build Picnic.Api/Picnic.Api.csproj --configuration Release --no-restore

      - name: Pack
        run: >
          dotnet pack Picnic.Api/Picnic.Api.csproj
          --configuration Release
          --no-build
          /p:PackageVersion=${{ steps.version.outputs.version }}
          --output ./artifacts

      - name: Upload package to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            artifacts/*.nupkg
            artifacts/*.snupkg

      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        id: nuget_login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish package to NuGet.org (Trusted Publishing)
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ steps.nuget_login.outputs.NUGET_API_KEY }}"
          --source "https://api.nuget.org/v3/index.json"
          --skip-duplicate
