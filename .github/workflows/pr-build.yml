name: PR Build

on:
  pull_request:
    branches:
      - "**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Picnic.Api/Picnic.Api.csproj

      - name: Build
        run: dotnet build Picnic.Api/Picnic.Api.csproj --configuration Release --no-restore
